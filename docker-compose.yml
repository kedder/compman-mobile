# Development environment service definition.
#
# Use `make <target>` rather than calling docker compose directly.
#
# Volumes:
#   .:/app              — live source code (changes are reflected immediately)
#   pub_cache           — Dart pub cache  (survives container restarts)
#   gradle_cache        — Gradle cache    (survives container restarts)

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: compman-mobile-dev:latest
    working_dir: /app
    volumes:
      - .:/app
      - pub_cache:/opt/pub-cache
      - gradle_cache:/home/dev/.gradle
    environment:
      - PUB_CACHE=/opt/pub-cache

  # Used by `make flutter-run` on Linux to connect to a host emulator/device
  # via ADB. network_mode: host gives the container access to the host's ADB
  # server (localhost:5037). Does not work on macOS or Windows Docker Desktop.
  flutter-run:
    extends:
      service: dev
    network_mode: host

volumes:
  pub_cache:
  gradle_cache:

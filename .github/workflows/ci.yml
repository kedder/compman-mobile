# Compman Mobile — Continuous Integration
#
# Triggered when a version tag of the form X.Y.Z is pushed (e.g. 2.5.12).
# Builds a signed release AAB and publishes it as a workflow artifact.
#
# --build-name is set to the tag name (e.g. 2.5.12).
# --build-number is set to github.run_number (monotonically increasing integer).
#
# Required repository secrets:
#   UPLOAD_KEYSTORE_BASE64          — base64-encoded upload-key.jks  (base64 -w 0 upload-key.jks)
#   UPLOAD_KEY_ALIAS                — key alias inside the keystore
#   UPLOAD_KEY_PASSWORD             — key password (also used as the store password)
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON — contents of the Google Play service account JSON key
#
# Image-layer caching strategy (keeps regular builds fast despite the ~7 GB image):
#   • docker/build-push-action with BuildKit registry cache stores every layer in
#     GHCR under `ghcr.io/<owner>/<repo>/builder-cache:latest`.
#   • On subsequent runs BuildKit fetches only the layers whose content has
#     changed; an unchanged Dockerfile is a 100 % cache hit (~1-2 min vs
#     ~15 min from scratch).
#   • Dart pub packages and Gradle caches are stored separately via
#     actions/cache so they survive across pushes independently of the image.

name: CI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    branches:
      - ci/test-play-upload

permissions:
  contents: read
  packages: write   # required to push BuildKit layer cache to GHCR

jobs:
  build:
    name: Build release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # GHCR login — GITHUB_TOKEN is automatically available; no extra secret needed.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit is required for type=registry cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Cache Dart pub packages between pushes.
      # Key changes only when pubspec.yaml or pubspec.lock change.
      - name: Cache Dart pub packages
        uses: actions/cache@v5
        with:
          path: /tmp/pub-cache
          key: pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-

      # Cache Gradle build artefacts between pushes.
      # Key changes when any Gradle build file or the wrapper properties change.
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: /tmp/gradle-cache
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      # Build the builder image from the project Dockerfile.
      # `load: true`  — materialise the built image in the local Docker daemon
      #                 so the subsequent `docker run` can use it.
      # `push: false` — we never push the image itself, only its layer cache.
      # `cache-from/cache-to` — read and write BuildKit layer cache in GHCR.
      # `mode=max`    — cache all layers (intermediate + final), maximising hits.
      - name: Build builder image (with registry layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: compman-mobile-dev:ci
          build-args: |
            HOST_UID=1000
            HOST_GID=1000
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/builder-cache:latest
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/builder-cache:latest,mode=max

      # Ensure the container's `dev` user (uid 1000) can read/write the workspace
      # and the two host-side cache directories.
      - name: Prepare cache dirs and workspace permissions
        run: |
          mkdir -p /tmp/pub-cache /tmp/gradle-cache
          sudo chown -R 1000:1000 /tmp/pub-cache /tmp/gradle-cache "$GITHUB_WORKSPACE"

      # Decode the base64-encoded keystore secret to a temp file on the runner.
      # The file is bind-mounted into the Docker container in the build step below.
      - name: Decode upload keystore
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload-key.jks
          chmod 600 /tmp/upload-key.jks
          sudo chown 1000:1000 /tmp/upload-key.jks

      # Run `flutter pub get` then `flutter build appbundle --release` inside the
      # builder container, mirroring `make deps && make build`.
      # Volume mounts:
      #   $GITHUB_WORKSPACE    → /app              (project source + build output)
      #   /tmp/pub-cache       → /opt/pub-cache    (Dart package cache)
      #   /tmp/gradle-cache    → /home/dev/.gradle (Gradle cache)
      #   /tmp/upload-key.jks  → /tmp/upload-key.jks (signing keystore)
      # Signing env vars are injected from repository secrets.
      - name: Build release AAB
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -v /tmp/pub-cache:/opt/pub-cache \
            -v /tmp/gradle-cache:/home/dev/.gradle \
            -v /tmp/upload-key.jks:/tmp/upload-key.jks:ro \
            -e PUB_CACHE=/opt/pub-cache \
            -e UPLOAD_STORE_FILE=/tmp/upload-key.jks \
            -e UPLOAD_STORE_PASSWORD="${{ secrets.UPLOAD_KEY_PASSWORD }}" \
            -e UPLOAD_KEY_ALIAS="${{ secrets.UPLOAD_KEY_ALIAS }}" \
            -e UPLOAD_KEY_PASSWORD="${{ secrets.UPLOAD_KEY_PASSWORD }}" \
            compman-mobile-dev:ci \
            bash -c "flutter pub get && flutter build appbundle --release \
              --build-name '${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}' \
              --build-number '${{ github.run_number }}'"

      # Hand ownership of the cache dirs back to the runner user so that the
      # actions/cache post-step can archive them without permission errors.
      # (The container's `dev` user, uid 1000, writes files as a different
      # owner than the GitHub Actions runner user.)
      - name: Fix cache dir permissions
        if: always()
        run: sudo chown -R "$USER" /tmp/pub-cache /tmp/gradle-cache "$GITHUB_WORKSPACE"

      # Upload the signed AAB to Google Play internal testing track as a draft.
      # Promote to a higher track manually in Play Console after review.
      #
      # Required repository secret:
      #   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON — contents of the service account JSON key
      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: lt.lebedev.compman_mobile
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "lt.lebedev.compman_mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"
    buildToolsVersion = "35.0.0"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "lt.lebedev.compman_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // Credentials are injected via environment variables.
            // Locally:   set UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD in .env
            //            (the keystore file is already mounted at secret/upload-key.jks)
            // CI/CD:     decode keystore to a temp path, set UPLOAD_STORE_FILE to that path,
            //            and set the three password variables as repository secrets.
            storeFile file(System.getenv("UPLOAD_STORE_FILE") ?: "../../secret/upload-key.jks")
            storePassword System.getenv("UPLOAD_STORE_PASSWORD") ?: ""
            keyAlias System.getenv("UPLOAD_KEY_ALIAS") ?: ""
            keyPassword System.getenv("UPLOAD_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            // Use the upload key when credentials are present; fall back to debug key otherwise.
            def hasUploadKey = System.getenv("UPLOAD_STORE_PASSWORD") != null
            signingConfig = hasUploadKey ? signingConfigs.release : signingConfigs.debug
            // Embed native symbol tables in the AAB so Google Play can decode crash
            // stack traces from the Flutter engine and native plugins automatically.
            // SYMBOL_TABLE gives function names (~1-2 MB overhead); use FULL only
            // if you need line-level info in custom C/C++ code.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
}

flutter {
    source = "../.."
}

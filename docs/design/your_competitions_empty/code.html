<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GliderSync - No Competitions</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "inverse-surface": "#263143",
            "on-tertiary-container": "#303436",
            "primary": "#006591",
            "on-secondary-fixed-variant": "#38485d",
            "on-error": "#ffffff",
            "on-background": "#111c2d",
            "surface-container-highest": "#d8e3fb",
            "on-tertiary": "#ffffff",
            "secondary-fixed": "#d3e4fe",
            "on-secondary-container": "#54647a",
            "surface-bright": "#f9f9ff",
            "on-primary-container": "#003751",
            "surface-container-high": "#dee8ff",
            "primary-fixed-dim": "#89ceff",
            "secondary-fixed-dim": "#b7c8e1",
            "on-primary-fixed-variant": "#004c6e",
            "surface-variant": "#d8e3fb",
            "tertiary-fixed-dim": "#c4c7c9",
            "secondary-container": "#d0e1fb",
            "on-error-container": "#93000a",
            "surface": "#f9f9ff",
            "on-secondary": "#ffffff",
            "surface-tint": "#006591",
            "outline-variant": "#bec8d2",
            "on-surface": "#111c2d",
            "tertiary-container": "#999c9e",
            "primary-fixed": "#c9e6ff",
            "on-tertiary-fixed": "#191c1e",
            "on-surface-variant": "#3e4850",
            "on-primary": "#ffffff",
            "error-container": "#ffdad6",
            "surface-container": "#e7eeff",
            "surface-container-low": "#f0f3ff",
            "inverse-primary": "#89ceff",
            "on-secondary-fixed": "#0b1c30",
            "surface-container-lowest": "#ffffff",
            "secondary": "#505f76",
            "primary-container": "#0ea5e9",
            "tertiary-fixed": "#e0e3e5",
            "outline": "#6e7881",
            "error": "#ba1a1a",
            "background": "#f9f9ff",
            "on-primary-fixed": "#001e2f",
            "on-tertiary-fixed-variant": "#444749",
            "tertiary": "#5c5f61",
            "inverse-on-surface": "#ecf1ff",
            "surface-dim": "#cfdaf2"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "stack-md": "16px",
            "gutter": "12px",
            "base-unit": "4px",
            "stack-lg": "24px",
            "stack-sm": "8px",
            "margin-mobile": "16px"
          },
          "fontFamily": {
            "headline-lg": ["Inter"],
            "body-sm": ["Inter"],
            "label-caps": ["Inter"],
            "body-lg": ["Inter"],
            "status-badge": ["Inter"],
            "headline-md": ["Inter"]
          },
          "fontSize": {
            "headline-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
            "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
            "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "status-badge": ["11px", {"lineHeight": "12px", "fontWeight": "800"}],
            "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
          }
        },
      },
    }
  </script>
<style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
    }
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar Component -->
<header class="bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center w-full px-4 h-16 z-40 fixed top-0 left-0">
<div class="flex items-center gap-4">
<button class="p-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors active:scale-95 duration-150 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-xl font-bold text-slate-900 dark:text-slate-50 font-headline-md tracking-tight">GliderSync</h1>
</div>
<div class="flex items-center gap-2">
<!-- Search removed per request -->
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-16">
<!-- Empty State Content -->
<div class="max-w-md w-full text-center space-y-stack-lg">
<!-- Utilitarian Illustration (CSS Based) -->
<div class="relative w-48 h-48 mx-auto mb-stack-lg flex items-center justify-center">
<!-- Abstract Wing Shape / Flight Path -->
<div class="absolute inset-0 bg-primary-container/10 rounded-full scale-110"></div>
<div class="relative z-10 w-32 h-32 bg-surface-container-lowest border border-outline-variant rounded-xl flex items-center justify-center shadow-sm">
<div class="absolute -top-4 -right-4 bg-secondary-fixed text-on-secondary-fixed w-12 h-12 rounded-lg flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-3xl" data-icon="flight_takeoff">flight_takeoff</span>
</div>
<div class="p-4 space-y-2 w-full">
<div class="h-2 w-3/4 bg-surface-container-highest rounded-full"></div>
<div class="h-2 w-1/2 bg-surface-container-high rounded-full"></div>
<div class="h-2 w-2/3 bg-surface-container-highest rounded-full"></div>
</div>
</div>
<!-- Decorative Path Lines -->
<svg class="absolute inset-0 w-full h-full text-primary/20 pointer-events-none" viewbox="0 0 100 100">
<path d="M 20 80 Q 50 10 80 80" fill="none" stroke="currentColor" stroke-dasharray="4 4" stroke-width="2"></path>
</svg>
</div>
<div class="space-y-stack-sm">
<h2 class="font-headline-lg text-headline-lg text-on-background">Add your first competition</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant px-4">
          Start tracking tasks and waypoint downloads.
        </p>
</div>
<!-- Action Area -->
<div class="pt-stack-md">
<button class="inline-flex items-center justify-center px-8 py-4 bg-primary text-on-primary rounded-xl font-headline-md shadow-lg hover:shadow-xl active:scale-95 transition-all duration-200 group">
<span class="material-symbols-outlined mr-2 group-hover:rotate-90 transition-transform duration-300" data-icon="add">add</span>
          Add Competition
        </button>
</div>
</div>
<!-- Info Panels removed per request -->
</main>
<!-- Floating Action Button -->
<!-- Subtle Texture Overlay -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] mix-blend-overlay">
<div class="w-full h-full bg-[radial-gradient(#000_1px,transparent_1px)] [background-size:20px_20px]"></div>
</div>
</body></html>
